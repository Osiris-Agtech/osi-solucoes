name: osi_solucoes
description: A new Flutter project.

publish_to: 'none'
version: 1.0.5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  flutter_localizations: 
    sdk: flutter
  localization: ^2.1.1
  brasil_fields: ^1.18.0
  graphql: ^5.2.2
  flutter_svg: ^2.2.1
  http: ^1.5.0
  json_serializable: ^6.11.1
  json_annotation: ^4.9.0
  search_cep: ^4.0.2
  dartz: ^0.10.1
  shared_preferences: ^2.5.3
  rive: ^0.13.20
  # ff_navigation_bar: ^0.1.5
  dropdown_search: ^6.0.2
  provider: ^6.1.5+1
  get_it: ^8.2.0
  get: ^4.7.2
  connectivity_plus: ^7.0.0
  formz: ^0.8.0
  dots_indicator: ^4.0.1
  carousel_slider: ^5.1.1
  dio: ^5.9.0
  flutter_datetime_picker_plus: ^2.2.0
  flutter_speed_dial: ^7.0.0
  animations: ^2.1.0
  table_calendar: ^3.2.0
  faker: ^2.2.0
  fl_chart: ^1.1.1
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  cloud_functions: ^5.1.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Responsividade
  sizer: ^3.0.0
  responsive_framework: ^1.4.0

  intl: any
  shared_preferences_web: any
  # flutter_web_plugins: any
  collection: any
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  mobx_codegen: ^2.7.4
  modular_test: ^2.0.0
  mockito: ^5.5.1
  flutter_launcher_icons: ^0.14.4
  
  # Testes de responsividade
  device_preview: ^1.1.0

dependency_overrides:
  file: ^7.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/launcher_icon.png"
 
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/core/constants/i18n/
    - assets/animation/
    - assets/icons/
  fonts:
     - family: Montserrat
       fonts:
         - asset: assets/fonts/Montserrat/static/Montserrat-Regular.ttf
         - asset: assets/fonts/Montserrat/static/Montserrat-Italic.ttf
           style: italic